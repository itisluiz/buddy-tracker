[platformio]
default_envs = tracker

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
lib_deps = olikraus/U8g2@^2.36.2

; LoRa position sharing, OLED map, Morse, BLE companion website
[env:tracker]
build_src_filter = +<tracker/>
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@^7.1.2
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^7.2.0

; GPS wiring/baud probe
[env:probe]
build_src_filter = +<probe.cpp>
